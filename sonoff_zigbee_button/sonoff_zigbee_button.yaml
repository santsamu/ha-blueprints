blueprint:
  name: Sonoff Zigbee Button
  description: >-
    Assign actions to press, double press, and hold on a SONOFF Zigbee button
    paired through ZHA. Supports devices reported as eWeLink WB01 or SNZB-01P.
    Empty gestures are ignored without interrupting running actions. Choose how
    additional button presses are handled while an action sequence is still
    running, and optionally log presses ignored because the automation is busy.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/santsamu/ha-blueprints/blob/main/sonoff_zigbee_button/sonoff_zigbee_button.yaml
  input:
    button_id:
      name: Button
      description: Select the SONOFF button paired through Zigbee Home Automation (ZHA).
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: eWeLink
              model: WB01
            - integration: zha
              manufacturer: eWeLink
              model: SNZB-01P
          multiple: false
    mode:
      name: Automation mode
      description: >-
        single ignores new presses while actions run; restart stops the current
        sequence and starts the new one; queued runs sequences in order;
        parallel runs them concurrently. Choose queued to retain presses during
        long actions, up to 10 active and waiting runs. Parallel also allows up
        to 10 runs. See https://www.home-assistant.io/docs/automation/modes/.
      default: single
      selector:
        select:
          options:
            - single
            - restart
            - queued
            - parallel
    ignored_press_log_level:
      name: Ignored press logging
      description: >-
        Choose Warning to log configured gestures ignored while single mode is
        busy or when queued/parallel mode reaches its 10-run limit. Silent keeps
        the existing behavior. Empty gesture actions are filtered before this
        check and do not produce these warnings. Logging does not change how
        gestures are handled.
      default: silent
      selector:
        select:
          options:
            - label: Silent
              value: silent
            - label: Warning
              value: warning
    press_action:
      name: Press Action
      description: Actions to perform on a single press. Leave empty to do nothing.
      default: []
      selector:
        action: {}
    double_press_action:
      name: Double Press Action
      description: Actions to perform on a double press. Leave empty to do nothing.
      default: []
      selector:
        action: {}
    hold_action:
      name: Hold Action
      description: Actions to perform on hold. Leave empty to do nothing.
      default: []
      selector:
        action: {}

mode: !input mode
max_exceeded: !input ignored_press_log_level

triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input button_id
      command: "toggle"
    id: press
    variables:
      selected_action_sequence: !input press_action
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input button_id
      command: "on"
    id: double_press
    variables:
      selected_action_sequence: !input double_press_action
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input button_id
      command: "off"
    id: hold
    variables:
      selected_action_sequence: !input hold_action

# Automation conditions are checked before the action script applies its mode.
# Checking inside actions would be too late to protect a running restart sequence.
conditions:
  - alias: Ignore gestures without configured actions
    condition: template
    value_template: >-
      {{ selected_action_sequence is defined and
         selected_action_sequence | length > 0 }}

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: press
        sequence: !input press_action
      - conditions:
          - condition: trigger
            id: double_press
        sequence: !input double_press_action
      - conditions:
          - condition: trigger
            id: hold
        sequence: !input hold_action
