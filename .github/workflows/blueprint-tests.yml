name: Blueprint tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m unittest discover -s tests -v

  home-assistant-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            homeassistant: '2024.10.0'
          - python: '3.14'
            homeassistant: '2026.10.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/runtime/requirements-${{ matrix.homeassistant }}.txt
      - run: python -m pip install -r tests/runtime/requirements-${{ matrix.homeassistant }}.txt
      - run: python -m unittest discover -s tests/runtime -v
